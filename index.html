<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Drop</title>
<meta name="theme-color" content="#171817" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  html, body { margin: 0; height: 100%; background: #171817; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- The installable shell for Drop. The page itself lives in the notionwidget repo; this
     app sits outside that folder so it can be installed and appear in the Android share sheet. -->
<iframe id="drop" title="Drop" allow="clipboard-read; clipboard-write"></iframe>
<script>
  document.getElementById("drop").src = "/notionwidget/drop.html" + location.search;
  if (location.search) history.replaceState(null, "", location.pathname);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
